<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css">

    <style>
        header {
            background: #1B355F;
            color: aliceblue;
            padding-left: 10px;
            border-radius: 10px 10px 0px 0px;
            border-bottom: 5px solid #E0B44C;
            width: 450px;
        }

        .content {
            width: 400px;
        }

        .content {
            color: #14213D;
        }

        .form1 {
            display: flex;
            gap: 15px;
        }

        .form1>div {
            flex: 1;
        }

        .radio {
            display: flex;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>Registration Form</h1>
        </header>

        <div class="content">
            <h2>Student Details</h2>
            <form>
                <div class="form1">
                    <div>
                        <label for="fname">First Name<i class="fa-solid fa-globe"></i></label>
                        <input type="text" id="fname" class="form-control has-success"
                            placeholder="Enter your First Name" required autofocus>
                    </div>
                    <div>
                        <label for="lname">Last Name</label>
                        <input type="text" id="lname" class="form-control" placeholder="Enter your Last Name" required>
                    </div>
                </div><br>
                <div class="form-group has-success">
                    <label for="email">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="Enter your Email" required>
                </div>

                <div class="form-group has-error">
                    <label for="phone">Phone Number</label>
                    <input type="number" maxlength="10" id="phone" class="form-control"
                        placeholder="Enter your Phone Number" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" class="form-control" required>
                </div>


                <div class="gen">
                    <label for="gender">Gender</label>
                    <div class="radio">
                        <label>
                            <input type="radio" name="optionsRadios" id="optionsRadios1" value="option1">
                            Male
                        </label>
                    </div>
                    <div class="radio">
                        <label>
                            <input type="radio" name="optionsRadios" id="optionsRadios2" value="option2">
                            Female
                        </label>
                    </div>
                </div>


                <div class="form-group">
                    <label for="course">Course</label>
                    <select id="course" class="form-control" required>
                        <option value="#">Select Course</option>
                        <option>B.Sc</option>
                        <option>B.E</option>
                        <option>B.Tech</option>
                        <option>MCA</option>
                        <option>M.E</option>
                        <option>M.Tech</option>
                    </select>
                </div>


                <label for="lk">Languages Known</label> <br>
                <div class="checkbox-inline">
                    <input type="checkbox"> English
                </div>
                <div class="checkbox-inline">
                    <input type="checkbox">Tamil
                </div>
                <div class="checkbox-inline">
                    <input type="checkbox"> Telugu
                </div>
                <div class="checkbox-inline">
                    <input type="checkbox"> Hindi
                </div> <br><br>
                <label for="customRange1" class="form-label">Rate your Language Fluency (English)</label>
                <input type="range" class="form-range" id="customRange1"> <br>
                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea id="address" class="form-control" placeholder="Enter your Address" required></textarea>
                </div>

                <h2>Parent Details</h2>
                <div class="form1">
                    <div>
                        <label for="fname">Father Name</label>
                        <input type="text" id="fname" class="form-control has-success"
                            placeholder="Enter your Father's Name" required autofocus>
                    </div>
                    <div>
                        <label for="lname">Contact</label>
                        <input type="number" id="lname" class="form-control" placeholder="" required>
                    </div>
                </div><br>

                <div class="form1">
                    <div>
                        <label for="fname">Mother Name</label>
                        <input type="text" id="fname" class="form-control has-success"
                            placeholder="Enter your Mother's Name" required autofocus>
                    </div>
                    <div>
                        <label for="lname">Contact</label>
                        <input type="number" id="lname" class="form-control" placeholder="" required>
                    </div>
                </div><br>
                <div class="checkbox-inline">
                    <input type="checkbox">I confirm these details are correct and agree to the college contacting the
                    student and guardian about this application.
                </div> <br><br>

                <button type="submit" class="btn btn-primary">Register</button>
                <button type="reset" class="btn btn-default">Reset</button>
            </form>
        </div>
    </div>
</body>

</html>
