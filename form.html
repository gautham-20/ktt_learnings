<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>HTML FORM</h3>
    <form>
    <fieldset>
        <legend>Registration Form</legend>
        <label for="name">Enter your name</label> <br>
        <input type="text" name="name" id="name" required> <br><br>
        <label for="email">Enter your email</label> <br>
        <input type="email" name="email" id="email" required><br><br>
        <label for="phno">Enter your phone number</label> <br>
        <input type="number" name="phno" id="phno" required><br><br>
        <label for="password">Enter your password</label><br>
        <input type="password" name="password" id="password" required><br><br>
        <label for="confirmPassword">Confirm Password</label><br>
        <input type="password" name="password" id="password" required><br><br>
        <label for="gender">Select your gender</label><br>
        <input type="radio" name="gender" id="gender">
        <label for="male">Male</label>
        <input type="radio" name="gender" id="gender">
        <label for="male">Female</label><br><br>
        <label for="dob">Enter your date of birth</label><br>
        <input type="date" name="dob" id="dob" required><br><br>
        <label for="address">Enter your address</label><br>
        <textarea name="address" id="address" required></textarea><br><br>
        <input type="submit" name="submit" id="submit" value="Submit">
        <input type="reset" name="reset" id="reset" value="Reset">
    </fieldset>
</form>
</body>

</html>
